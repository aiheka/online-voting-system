{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<form method="POST">

    <input name="username"
           placeholder="Username"
           class="form-control mb-2">

    <input type="password"
           name="password"
           placeholder="Password"
           class="form-control mb-2">

    <button class="btn btn-primary">
        Login
    </button>

</form>

<br>

<a href="/microsoft_login"
   class="btn btn-success">

   Login with Microsoft

</a>

<br><br>

<a href="/register">
    Register
</a>

{% endblock %}
