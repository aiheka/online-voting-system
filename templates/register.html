{% extends "base.html" %}

{% block content %}

<h2>Register</h2>

<form method="POST">

    <input name="username"
           placeholder="Username"
           class="form-control mb-2">

    <input type="password"
           name="password"
           placeholder="Password"
           class="form-control mb-2">

    <button class="btn btn-success">
        Register
    </button>

</form>

{% endblock %}
